services:
  growgate-mysql:
    image: mysql:8.4
    container_name: growgate-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-growgate_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growgate}
      MYSQL_USER: ${MYSQL_USER:-growgate_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-growgate_app}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - growgate_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  growgate_mysql_data:
