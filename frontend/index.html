<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GROW-GATE Local EX</title>
    <!-- Google Fonts: Manrope(영문) 로드. 한글은 시스템 돋움체 사용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      id="root": React가 실제 DOM을 마운트하는 진입점.
      ReactDOM.createRoot(document.getElementById('root'))로 연결됨
    -->
    <div id="root"></div>
    <!--
      type="module": Vite가 ES Module 방식으로 JS를 처리하도록 지정.
      브라우저가 import/export 구문을 직접 이해하게 함
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
