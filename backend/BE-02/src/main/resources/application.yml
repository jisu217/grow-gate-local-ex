server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    com.growgate: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p traceId=%X{correlationId:-none} thread=%t logger=%logger{36} msg=%replace(%m){'(?i)(serviceKey|apiKey|token|password|client_secret)=([^&\\s]+)','$1=[REDACTED]'}%n%ex"
