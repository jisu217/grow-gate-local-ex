name: GrowGate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  risk-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run submission risk gates
        run: ./scripts/check-risk-gates.sh

  backend:
    runs-on: ubuntu-latest
    needs: risk-gates
    defaults:
      run:
        working-directory: backend/BE-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    needs: risk-gates
    defaults:
      run:
        working-directory: frontend/FE-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/FE-02/package-lock.json
      - run: npm ci
      - run: npm run test:mappers
      - run: npm run build
